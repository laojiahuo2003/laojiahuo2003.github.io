name: 📈 生成每周黑马周报

on:
  schedule:
    - cron: '30 1 * * 1'  # 北京时间周一 09:30（日报 09:00 之后，历史已含当日数据）
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # 允许 gh workflow run 触发部署

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成周报
        env:
          TZ: Asia/Shanghai
        run: python daily/weekly_report.py

      - name: 提交数据
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/weekly.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "无新数据，跳过提交"
          else
            git commit -m "Add weekly report $(TZ='Asia/Shanghai' date +'%Y-%m-%d')"
            git pull --rebase
            git push
            echo "PUSHED=1" >> "$GITHUB_ENV"
          fi

      # 注意：GITHUB_TOKEN 的 push 不会触发其他 workflow（GitHub 防递归），
      # 必须显式 dispatch 部署，否则 Pages 停留在旧构建
      - name: 触发 Pages 部署
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

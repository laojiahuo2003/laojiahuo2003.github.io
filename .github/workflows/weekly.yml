name: 📈 生成每周黑马周报

on:
  schedule:
    - cron: '30 1 * * 1'  # 北京时间周一 09:30（日报 09:00 之后，历史已含当日数据）
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成周报
        env:
          TZ: Asia/Shanghai
        run: python daily/weekly_report.py

      - name: 提交数据
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/weekly.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Add weekly report $(TZ='Asia/Shanghai' date +'%Y-%m-%d')"
          git pull --rebase
          git push

      # push 到 main 自动触发 deploy.yml 部署 Pages

name: 📰 生成开源日报

on:
  schedule:
    - cron: '0 1 * * *'   # 北京时间 09:00
    - cron: '0 10 * * *'  # 北京时间 18:00
  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # 允许 gh workflow run 触发部署

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 清理 60 天前的报告
        run: |
          find daily/reports -name "*.md" -type f -mtime +60 -delete || true
          find daily/reports -name "*.json" -type f -mtime +60 -delete || true
          echo "Deleted reports older than 60 days"

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r daily/requirements.txt

      - name: 生成日报
        env:
          MY_GITHUB_TOKEN: ${{ github.token }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TZ: Asia/Shanghai
        run: python daily/main.py

      # history/ 必须一并提交：star 历史断链会导致周增长/快速成长板块恒为空
      # （旧仓库的 workflow 漏掉它，迁移时修复）
      - name: 提交数据
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add daily/reports daily/history src/data/feed.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "无新数据，跳过提交"
          else
            git commit -m "Add daily report $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
            echo "PUSHED=1" >> "$GITHUB_ENV"
          fi

      # 注意：GITHUB_TOKEN 的 push 不会触发其他 workflow（GitHub 防递归），
      # 必须显式 dispatch 部署，否则 Pages 停留在旧构建
      - name: 触发 Pages 部署
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
